[package]
name = "growing-guns-app"
edition.workspace = true
version.workspace = true
description = "Growing Guns on Warp: split-screen renderer, input and headless captures"

[[bin]]
name = "growing-guns"
path = "src/main.rs"

[dependencies]
growing-guns.workspace = true
render = { path = "../../../engine/crates/render" }
glam = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
winit = "0.30"
wgpu = "30"

[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[target.'cfg(not(windows))'.dependencies]
gilrs = "0.11"
