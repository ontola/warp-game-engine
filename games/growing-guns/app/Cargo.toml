[package]
name = "growing-guns-app"
edition.workspace = true
version.workspace = true
description = "Growing Guns on Warp: split-screen renderer, input and headless captures"

[[bin]]
name = "growing-guns"
path = "src/main.rs"

[dependencies]
growing-guns.workspace = true
kern.workspace = true
render = { path = "../../../engine/crates/render" }
assets = { path = "../../../engine/crates/assets" }
app = { path = "../../../engine/crates/app" }
audio = { path = "../../../engine/crates/audio", features = ["luau"] }
live = { path = "../../../engine/crates/live" }
physics = { path = "../../../engine/crates/physics" }
glam = "0.31"
fastnoise-lite.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "30"
net = { path = "../../../engine/crates/net" }
script = { path = "../../../engine/crates/script" }
gamenight = { path = "../../../engine/crates/gamenight" }
tokio = { version = "1", features = ["sync"] }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true


[dev-dependencies]
postcard = { version = "1", features = ["alloc"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies.warp-xr]
path = "../../../engine/crates/xr"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
log = "0.4"
zip = { version = "4", default-features = false, features = ["deflate"] }
