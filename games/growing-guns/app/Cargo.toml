[package]
name = "growing-guns-app"
edition.workspace = true
version.workspace = true
description = "Growing Guns on Warp: split-screen renderer, input and headless captures"

[[bin]]
name = "growing-guns"
path = "src/main.rs"

[dependencies]
growing-guns.workspace = true
kern.workspace = true
render = { path = "../../../engine/crates/render" }
app = { path = "../../../engine/crates/app" }
glam = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
wgpu = "30"
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
postcard = { version = "1", features = ["alloc"] }
serde.workspace = true
serde_json.workspace = true

