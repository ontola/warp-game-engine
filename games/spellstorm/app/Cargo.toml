[package]
name = "spellstorm-app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Spellstorm on Warp: the Godot game's look over the hecs sim"

[lib]
name = "spellstorm_app"
path = "src/lib.rs"

[[bin]]
name = "spellstorm"
path = "src/main.rs"

[dependencies]
spellstorm.workspace = true
kern.workspace = true
render = { path = "../../../engine/crates/render" }
app = { path = "../../../engine/crates/app" }
physics = { path = "../../../engine/crates/physics" }
assets = { path = "../../../engine/crates/assets" }
body = { path = "../../../engine/crates/body" }
splitscreen-club = { path = "../../../engine/crates/splitscreen-club" }
live = { path = "../../../engine/crates/live" }
vfs = { path = "../../../engine/crates/vfs" }
glam = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json.workspace = true
flate2 = "1"
hecs = "0.10"

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# The browser build and the Android host (web.rs): std::time::Instant panics in a browser.
[target.'cfg(any(target_arch = "wasm32", target_os = "android"))'.dependencies]
web-time = "1.1"
