# What `sideways gpu-run` does on the GPU runner (see engine/docs/gpu-runner.md). Every
# job renders offscreen; nothing opens a window.

[[job]]
kind = "info"

[[job]]
kind = "test-frame"
size = [640, 360]

# Held benchmark spot: seed 4242, 300 m, clear. 1080p and native 4K,
# one view followed by a separate four-view case.
[[job]]
kind = "stage-frame"
name = "stage-1080p"
seed = 4242
at = 300
weather = "clear"
size = [1920, 1080]
repeat = 9

[[job]]
kind = "stage-frame"
name = "stage-4k"
seed = 4242
at = 300
weather = "clear"
size = [3840, 2160]
repeat = 9

# Sideways target: four players, native 4K, 120 FPS (8.33 ms).
[[job]]
kind = "stage-frame"
name = "stage-4k-4views"
seed = 4242
at = 300
weather = "clear"
views = 4
size = [3840, 2160]
repeat = 9
