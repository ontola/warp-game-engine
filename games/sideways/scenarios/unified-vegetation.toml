# Bounded mixed grass/sapling slice. Native only, no change to default foliage.
# Required environment: SIDEWAYS_PROCEDURAL_GRASS=source (or experimental auto),
# SIDEWAYS_PROCEDURAL_GRASS_CELL=-177,-723, SIDEWAYS_FAR_GRASS=0.
# Explicit cells keep the population fixed when the camera moves.
# This is a real stage preview, not an optical oracle or gameplay FPS benchmark.
schema = 1
name = "unified-vegetation"
ticks_per_frame = 0
capture_frames = [30, 60, 90, 120]

[capture]
format = "jpg"
max_width = 1600
quality = 90

[scene]
seed = 1
km = 3.0
weather = "clear"
views = 1
size = "1600x900"
upscale = "native"
hud = false

