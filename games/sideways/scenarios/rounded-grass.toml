# Matched native Sideways views for the flat/rounded grass shading experiment.
# Set SIDEWAYS_PROCEDURAL_GRASS=field and compare
# SIDEWAYS_MEADOW_BLADE_SHADING=flat|rounded with the same remaining environment.
# Static cameras/poses; not a DLSS, motion-quality or performance acceptance run.
schema = 1
name = "rounded-grass"
ticks_per_frame = 0
capture_frames = [24, 48]

