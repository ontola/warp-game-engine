name: Native checks and Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: CPU and shader checks
        run: |
          cargo +stable test --locked --workspace --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s engine/tools -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./games/sideways/tools/test-play-dev.ps1
      - name: Build native Windows game
        run: cargo +stable build --locked --release -p cli --bin sideways
      - name: Package game and licensed assets
        run: ./games/sideways/tools/package-windows.ps1 -Executable target/release/sideways.exe -OutDirectory build/windows
      - name: Packaged deterministic simulation
        run: |
          $env:SIDEWAYS_GAME_ROOT=(Resolve-Path build/windows).Path
          ./build/windows/Sideways.exe sim --ticks 45000 --seed 1 --km 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive
        run: |
          Compress-Archive -Path build/windows/* -DestinationPath build/sideways-windows.zip
          $hash=(Get-FileHash build/sideways-windows.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  sideways-windows.zip" | Set-Content build/release-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sideways-windows
          path: |
            build/sideways-windows.zip
            build/release-sha256.txt
          if-no-files-found: error
# CI checks native CPU/shader/build/package behavior. GPU quality/performance and
# physical controllers require the separate local acceptance fixtures.
# DLSS SDK binaries are optional and are not fetched or redistributed by CI.
