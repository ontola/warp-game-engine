<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Splitscreen Club</title>
<meta name="description" content="Couch games for everyone in the room. Grab a controller, scan the code with your phone, play.">
<link rel="icon" type="image/png" href="splitscreen-club-icon.png">
<style>
@font-face{font-family:Bungee;src:url(fonts/bungee-regular.ttf) format("truetype");font-display:block}
@font-face{font-family:Outfit;src:url(fonts/outfit-600.ttf) format("truetype");font-weight:600;font-display:swap}
@font-face{font-family:Outfit;src:url(fonts/outfit-800.ttf) format("truetype");font-weight:800;font-display:swap}
:root{--bg:#0d1020;--text:#eef0fc;--muted:#a8adc4;--amber:#ffb454;--violet:#a78bfa;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:600 16px/1.5 Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
canvas#warp{width:100vw;height:100vh;display:block;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}

/* The loading screen: the whole page until the room's first frame. */
#warp-progress{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;box-sizing:border-box;
  background:radial-gradient(60% 50% at 30% 35%,rgba(255,180,84,.16),transparent 70%),radial-gradient(55% 50% at 72% 65%,rgba(167,139,250,.18),transparent 70%),var(--bg);
  transition:opacity .45s ease,visibility .45s;z-index:2}
#warp-progress[hidden]{display:flex;opacity:0;visibility:hidden;pointer-events:none}
.brand{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.brand img{width:112px;height:112px;border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.45);animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.wordmark{font:400 clamp(34px,7vw,72px)/1 Bungee,Outfit,system-ui;letter-spacing:.01em;margin:0}
.wordmark .a{color:var(--amber)}.wordmark .b{color:var(--violet)}
.tagline{margin:0;color:var(--muted);font-size:clamp(15px,2.2vw,19px)}
.loader{width:min(440px,82vw);display:flex;flex-direction:column;gap:12px}
#warp-track{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
#warp-bar{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--amber),var(--violet));transition:width .3s ease}
#warp-step{text-align:center;color:var(--muted);font-size:15px;min-height:1.5em}
.hints{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:0;padding:0;list-style:none}
.hints li{padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--text);font-size:14px}
.hints b{color:var(--amber);font-weight:800}

/* After the first frame, loading a game shows only a small card at the bottom. */
#warp-progress.later{inset:auto auto 28px 50%;transform:translateX(-50%);width:min(360px,80vw);padding:14px 18px;gap:0;border-radius:16px;
  background:rgba(13,16,32,.88);border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(8px)}
#warp-progress.later .brand,#warp-progress.later .hints{display:none}
#warp-progress.later .loader{width:100%}
#warp-progress.later #warp-step{font-size:14px}

#warp-log{display:none;position:fixed;left:8px;bottom:8px;white-space:pre-wrap;max-width:90vw;max-height:40vh;overflow:hidden;pointer-events:none;font:12px monospace;color:#ddd;text-shadow:0 0 3px #000;z-index:3}
#warp-games{display:none!important}
body.debug #warp-log{display:block}
body.debug #warp-games{display:flex!important}
</style>
</head><body><canvas id="warp" tabindex="0"></canvas>
<div id="warp-progress">
  <div class="brand">
    <img src="splitscreen-club-icon.png" alt="">
    <h1 class="wordmark"><span class="a">Splitscreen</span><span class="b">.Club</span></h1>
    <p class="tagline">Couch games for everyone in the room</p>
  </div>
  <div class="loader">
    <div id="warp-track"><div id="warp-bar"></div></div>
    <div id="warp-step">Loading</div>
  </div>
  <ul class="hints">
    <li><b>Controller</b> press any button to join</li>
    <li><b>Phone</b> scan the code on the wall</li>
  </ul>
</div>
<div id="warp-log"></div>
<script type="module">
import init from './pkg/terrain_fly.js';
// ?debug shows the engine log and the game buttons.
if (new URLSearchParams(location.search).has('debug')) document.body.classList.add('debug');
const box = document.getElementById('warp-progress'), log = document.getElementById('warp-log'), bar = document.getElementById('warp-bar'), step = document.getElementById('warp-step');
const show = (f, t) => { bar.style.width = (f * 100).toFixed(1) + '%'; step.textContent = t; };
// Once the room is on screen, later loading (a game) is a small card.
new MutationObserver(() => { if (box.hidden) box.classList.add('later'); }).observe(box, { attributes: true, attributeFilter: ['hidden'] });
// Download the wasm with byte progress (the first 30 % of the bar); the
// engine reports the later steps itself.
async function wasm() {
  const r = await fetch('pkg/terrain_fly_bg.wasm');
  if (!r.ok) throw new Error('pkg/terrain_fly_bg.wasm: HTTP ' + r.status);
  const total = +r.headers.get('content-length') || 0, parts = [];
  let got = 0;
  for (const reader = r.body.getReader();;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    // A compressed download has no total we can use: show the bytes so far.
    show(total && got <= total ? 0.3 * got / total : Math.min(0.28, 0.3 * got / 27e6), `Downloading the club (${(got / 1e6).toFixed(0)} MB)`);
  }
  return new Blob(parts).arrayBuffer();
}
if (!navigator.gpu) show(0, 'Splitscreen Club needs WebGPU: open this page in Chrome or Edge on a computer.');
else wasm().then(bytes => { show(0.3, 'Starting'); return init({ module_or_path: bytes }); })
  .catch(e => { show(0, 'Could not start: ' + e); log.textContent += 'start failed: ' + e + '\n'; console.error(e); });
</script></body></html>
