[package]
name = "game-room"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The Splitscreen Club Game Room lobby on Warp"

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-room"
path = "src/main.rs"

[dependencies]
render = { path = "../../engine/crates/render" }
app = { path = "../../engine/crates/app" }
glam = "0.31"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json.workspace = true
# Instant and SystemTime that also work in a browser (std::time is the same natively).
web-time = "1.1"
gdcompat.workspace = true
game-room-sim = { path = "sim" }
splitscreen-club = { path = "../../engine/crates/splitscreen-club" }

# The browser build (examples/browser.rs): the room first, Luau games from
# its shelf. Only for wasm32, so native builds and tests never compile warp.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
warp = { path = "../../engine/crates/warp" }
# Rust games built into the page (examples/browser/builtin.rs).
spellstorm-app = { path = "../../games/spellstorm/app" }
spaceracer-app = { path = "../../games/spaceracer/app" }
script = { path = "../../engine/crates/script" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"
# The cloud room: a device id and the room's QR code.
getrandom = { version = "0.3", features = ["wasm_js"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "DomRect"] }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
