[package]
name = "game-room"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The Splitscreen Club Game Room lobby on Warp"

[lib]
path = "src/lib.rs"

[[bin]]
name = "game-room"
path = "src/main.rs"

[dependencies]
render = { path = "../../engine/crates/render" }
app = { path = "../../engine/crates/app" }
glam = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { workspace = true }
serde_json.workspace = true
gdcompat.workspace = true
game-room-sim = { path = "sim" }
splitscreen-club = { path = "../../engine/crates/splitscreen-club" }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
