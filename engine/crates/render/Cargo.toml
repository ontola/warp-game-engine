[package]
name = "render"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Kern's renderer: GPU-driven clusters with LOD, visibility buffer, HDR, sun and sky light"

[features]
dlss = ["dep:ash"]
# Android phones (the native Splitscreen Club host): desktop texture array
# sizes instead of the headset ones.
phone = []

[dependencies]
vfs = { path = "../vfs" }
naga = { version = "30", features = ["wgsl-in"] }
# std::time::Instant panics in a browser (wasm32); this is std's on native.
web-time = "1.1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
meshopt = "0.7"
png = "0.18"
glam = { version = "0.31", features = ["bytemuck", "serde"] }
postcard = { version = "1", features = ["alloc"] }
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "hdr", "webp"] }
# BC7 block compression of the texture arrays (pure Rust, CPU; texture_stream.rs).
block_compression = { version = "0.11", default-features = false, features = ["bc7"] }
sha2.workspace = true
glyphon = "0.12"
# Stroked glyph outlines for HUD text outlines (the version glyphon uses).
swash = "0.2"
# SVG rasterising for runtime pictures (QR codes, icons); no text, no raster images.
resvg = { version = "0.45", default-features = false }
ash = { version = "0.38", optional = true }
serde_json.workspace = true

[build-dependencies]
cc = "1"

# DX12 compiles shaders with DXC, linked in. Without it wgpu falls back to
# FXC, which rejects the cull pipeline (X3663: barriers after data-dependent
# early exits it cannot prove uniform). WGPU_DX12_COMPILER still overrides.
[target.'cfg(all(windows, not(target_arch = "aarch64")))'.dependencies]
wgpu = { version = "30", features = ["static-dxc"] }
