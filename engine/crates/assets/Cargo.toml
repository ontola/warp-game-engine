[package]
name = "assets"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Asset import for Warp scenes: glTF models with materials and textures"

[dependencies]
render = { path = "../render" }
kern.workspace = true
vfs = { path = "../vfs" }
glam = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
gltf = { version = "1.4", default-features = false, features = ["utils", "names", "extras", "KHR_texture_transform", "allow_empty_texture", "extensions"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
app = { path = "../app" }
