[package]
name = "app"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Warp game shell: window, fixed tick, local player input, split-screen frames, headless capture"

[dependencies]
body = { path = "../body" }
# std::time::Instant panics in a browser (wasm32); this is std's on native.
web-time = "1.1"
render = { path = "../render" }
glam = "0.31"
winit = "0.30"
wgpu = "30"
audio = { path = "../audio", features = ["device"] }
serde.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json.workspace = true
# Text copy and paste, and F12 screenshots onto the clipboard.
[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data"] }

# Windows controllers are exposed through XInput; WGI can miss them.
# The browser shell (src/web.rs).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Gamepad", "GamepadButton", "GamepadMappingType", "HtmlCanvasElement", "Headers", "Location", "Navigator", "Request", "RequestInit", "Response", "Storage", "Window"] }

[target.'cfg(windows)'.dependencies]
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

[target.'cfg(all(not(windows), not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
gilrs = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
# The Android shell (src/android.rs): the activity, its window and input,
# assets from the APK, JNI for immersive mode and the device list, HTTPS.
android-activity = { version = "0.6", features = ["native-activity"] }
ndk = { version = "0.9", features = ["rwh_06"] }
ndk-sys = "0.6"
raw-window-handle = "0.6"
jni = "0.21"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
