[package]
name = "audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kern's audio: physically inspired engine sound synthesis (after engine-sim), mixing, WAV/Ogg Vorbis decoding and spectrograms"

[dependencies]
lewton = "0.10"
claxon = "0.4"
serde.workspace = true
toml.workspace = true
vfs = { path = "../vfs" }
mlua = { version = "0.12", features = ["luau", "send", "serialize"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = { version = "0.18", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { version = "0.18", optional = true, features = ["wasm-bindgen"] }
# A game in a Web Worker sends its sound to the page (device_worker.rs).
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["DedicatedWorkerGlobalScope", "WorkerGlobalScope"] }

[features]
device = ["dep:cpal", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
# Patches written in Luau, and the warp-audio render tool.
luau = ["dep:mlua"]

[[bin]]
name = "warp-audio"
required-features = ["luau"]
