[package]
name = "audio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Kern's audio: physically inspired engine sound synthesis (after engine-sim), mixing, WAV/Ogg Vorbis decoding and spectrograms"

[dependencies]
lewton = "0.10"
claxon = "0.4"
serde.workspace = true
toml.workspace = true
vfs = { path = "../vfs" }
mlua = { version = "0.12", features = ["luau", "send", "serialize"], optional = true }

[features]
# Patches written in Luau, and the warp-audio render tool.
luau = ["dep:mlua"]

[[bin]]
name = "warp-audio"
required-features = ["luau"]
