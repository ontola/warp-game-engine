[package]
name = "warp"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The warp executable: run games made only of Luau scripts, synth patches and assets, with hot reload and live control over MCP"

[[bin]]
name = "warp"
path = "src/main.rs"

[dependencies]
app = { path = "../app" }
render = { path = "../render" }
audio = { path = "../audio", features = ["luau"] }
script = { path = "../script" }
live = { path = "../live" }
splitscreen-club = { path = "../splitscreen-club" }
assets = { path = "../assets" }
body = { path = "../body" }
physics = { path = "../physics" }
kern.workspace = true
glam = "0.31"
bytemuck = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jsonschema = { version = "0.60.2", default-features = false }
rusqlite = { version = "0.41.1", features = ["bundled"] }
directories = "6.0.0"
sha2.workspace = true
mlua = { version = "0.12", features = ["serde"] }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png"] }
