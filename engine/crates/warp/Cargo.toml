[package]
name = "warp"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The warp executable: run games made only of Luau scripts, synth patches and assets, with hot reload and live control over MCP"

[[bin]]
name = "warp"
path = "src/main.rs"

[dependencies]
app = { path = "../app" }
render = { path = "../render" }
audio = { path = "../audio", features = ["luau"] }
script = { path = "../script" }
vfs = { path = "../vfs" }
web-time = "1.1"
live = { path = "../live" }
splitscreen-club = { path = "../splitscreen-club" }
assets = { path = "../assets" }
body = { path = "../body" }
physics = { path = "../physics" }
kern.workspace = true
glam = "0.31"
bytemuck = "1"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
jsonschema = { version = "0.60.2", default-features = false }
directories = "6.0.0"
sha2.workspace = true
mlua = { version = "0.12", features = ["serde"] }

[dev-dependencies]
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Game saves; a browser build (wasm32) keeps them in memory instead.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }

# The browser build (examples/warp_web.rs, engine/docs/browser.md).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Window"] }
