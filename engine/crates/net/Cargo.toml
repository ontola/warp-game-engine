[package]
name = "net"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Online play over iroh: a host and clients exchanging typed messages, behind channels the game loop polls"

[dependencies]
tokio = { version = "1", features = ["sync"] }
postcard = { version = "1", features = ["alloc"] }
serde.workspace = true

# iroh, sockets and a threaded runtime only natively; the browser build is a
# stub without online play (src/browser.rs).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
iroh = "1.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
