[package]
name = "script"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Luau scripting for Warp games: sandboxed modules from a folder, hot reload, deterministic step budget"

[dependencies]
mlua = { version = "0.12", features = ["luau", "send", "serialize"] }
vfs = { path = "../vfs" }
web-time = "1.1"
serde = { workspace = true }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
