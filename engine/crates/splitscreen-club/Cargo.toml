[package]
name = "splitscreen-club"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Splitscreen Club client for Warp games and lobbies: party sessions, seats, settings, actions, controller frames, the lobby role, room links and party artwork"

[dependencies]
serde_json.workspace = true
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

# tungstenite draws random bytes; in a browser they come from crypto.getRandomValues.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
