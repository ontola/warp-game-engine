[package]
name = "warp-xr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native OpenXR presentation for the Warp renderer"

[dependencies]
glam = "0.31"
render = { path = "../render" }
app = { path = "../app" }
wgpu = "30"

[target.'cfg(target_os = "android")'.dependencies]
openxr = "0.22"
ash = "0.38"
anyhow = "1"
android-activity = { version = "0.6", features = ["native-activity"] }
log = "0.4"
jni = "0.21"
