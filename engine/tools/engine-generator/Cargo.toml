[package]
name = "warp-engine-generator"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
description = "Local test bench for Warp engine and exhaust sounds"

[target.'cfg(windows)'.dev-dependencies]
audio = { path = "../../crates/audio", features = ["luau"] }

[target.'cfg(windows)'.dependencies]
audio = { path = "../../crates/audio", features = ["device"] }
arboard = { version = "3.6", default-features = false }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
