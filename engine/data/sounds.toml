# How each car's engine sounds (crates/audio, after engine-sim): runner
# pressures, delayed along their pipes, through engine-sim's synthesizer
# and a recorded exhaust impulse response from assets/sound/ir. Read at
# every run: change a number, render again (`sideways sound`), no rebuild.
# Models are merged over [base], key by key, like cars.toml (a model's
# [synth] table replaces the base one; missing keys take the defaults).

# A Rally2-like 1.6 l turbo inline four.
[base]
name = "Rally2 inline 4 turbo"
cylinders = 4
firing_order = [1, 3, 4, 2]
headers = [0.62, 0.60, 0.60, 0.62] # m, equal-ish 4-1
pipe = 2.9
roughness = [0.14, 0.05]
turbo = true
whistle = [1800.0, 7800.0]
gear_teeth = 23.0
pops = 0.18
exhaust = 0.8
intake = 0.04
mechanical = 0.01
whine = 0.004
turbo_level = 0.012
gain = 1.0

[base.synth] # engine-sim's AudioParameters; see crates/audio/src/es.rs
impulse_response = "minimal_muffling_03.wav"
ir_volume = 0.01
noise = 1.0
jitter = 0.5
hf_gain = 0.01

# Lancia-like: the classic 2.0 l turbo four, a hard edge at full throttle.
[models.asti]
name = "Asti Stradale inline 4 turbo"
headers = [0.55, 0.58, 0.58, 0.55]
pipe = 3.3

# Quattro-like five: 1-2-4-5-3, a firing every 144 degrees, the warble of
# half orders (2.5 per revolution), and a lot of anti-lag.
[models.mv6]
name = "MV6 inline 5 turbo"
cylinders = 5
firing_order = [1, 2, 4, 5, 3]
headers = [0.52, 0.56, 0.60, 0.56, 0.52]
pipe = 2.7
roughness = [0.16, 0.06]
pops = 0.32
whistle = [1600.0, 7000.0]

[models.mv6.synth]
impulse_response = "minimal_muffling_01.wav"

# Impreza-like flat four: even firing, but 1-3-2-4 into unequal headers,
# so the pulses reach the collector unevenly: the boxer burble.
[models.toyama]
name = "Toyama XR flat 4 turbo"
firing_order = [1, 3, 2, 4]
headers = [0.48, 0.48, 0.98, 0.98]
pipe = 3.1
pops = 0.14

# engine-sim's Subaru EJ25 uses the mild exhaust.
[models.toyama.synth]
impulse_response = "mild_exhaust.wav"
